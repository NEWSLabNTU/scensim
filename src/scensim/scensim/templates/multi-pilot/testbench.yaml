# @PROJECT@: three pilots of different kinds in one scenario on CARLA's Town01.
simulator: carla
assets:
  - dataset: carla-town-autoware-maps
    take: [Town01]
pilots:
  ego: {kind: autoware, vehicle: tesla_model3}
  lead: {kind: carla_basic}
  follower: {kind: command, run: [python3, pilots/follower.py]}
# The contact judge (issue 189) runs by default, before the verdict; it is listed here so a
# reader sees it. An undeclared contact fails the run: with an actor at any impulse, with the
# static world above 10 N*s. A scenario that means to touch declares csbExpectedContacts.
# Edit the entry to change it; to turn it off, replace it with
# {name: physical_verdict, off: true, why: "<the reason>"}.
judges:
  - name: physical_verdict
    run: [ros2, run, scensim_launch, physical_verdict, "{run_dir}/junit.xml",
          --scenario, "{run_dir}/scenario.xosc", --min-impulse, "10"]
