# multi_pilot: four pilots of three kinds in one scenario on CARLA's Town01.
simulator: carla
assets:
  - dataset: carla-town-autoware-maps
    take: [Town01]
pilots:
  ego: {kind: autoware, vehicle: tesla_model3}
  bg_av_*: {kind: autoware, vehicle: tesla_model3}   # a second Autoware, its own domain
  lead: {kind: carla_basic}                          # CARLA's BasicAgent
  cut_in:                                            # your own program: pilots/cut_in.py
    kind: command
    run: [python3, pilots/cut_in.py, --trigger-m, "40"]
    lifetime: run                                    # a fresh process, --seed and --run-dir per run
logging:
  keep: {passed: standard, failed: full, error: full}   # standard keeps logs/, cut_in.json
default: cut_in_seeds   # the suite `scensim run <testbench>` runs
# The contact judge (issue 189) runs by default, before the verdict; it is listed here so a
# reader sees it. An undeclared contact above 10 N*s fails the run; a scenario that means to
# touch declares csbExpectedContacts. Edit the entry to change it; to turn it off, replace it
# with {name: physical_verdict, off: true, why: "<the reason>"}.
judges:
  - name: physical_verdict
    run: [ros2, run, scensim_launch, physical_verdict, "{run_dir}/junit.xml",
          --scenario, "{run_dir}/scenario.xosc", --min-impulse, "10"]
