# isaac_first_drive: one Autoware ego on Isaac Sim, in CARLA's Town01 as USD.
simulator: isaac
assets:
  - dataset: carla-town-autoware-maps
    take: [Town01]               # the Autoware map and Town01's Isaac world file
  - dataset: carla-0.9.16-isaac-usd
    take: [Town01, vehicles]     # the town and the cars in USD: 19 GB of the 25.5
pilots:
  ego: {kind: autoware, vehicle: tesla_model3}
default: first   # the suite `scensim run <testbench>` runs
# The contact judge (issue 189) runs by default, before the verdict; it is listed here so a
# reader sees it. An undeclared contact above 10 N*s fails the run; a scenario that means to
# touch declares csbExpectedContacts. Edit the entry to change it; to turn it off, replace it
# with {name: physical_verdict, off: true, why: "<the reason>"}.
judges:
  - name: physical_verdict
    run: [ros2, run, scensim_launch, physical_verdict, "{run_dir}/junit.xml",
          --scenario, "{run_dir}/scenario.xosc", --min-impulse, "10"]
