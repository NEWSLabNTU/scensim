[workspace]
resolver = "2"
members = [
    "src/scenario_world_bridge",
]
# Submodules with workspaces of their own (roadmap 051): their crates are path dependencies
# here, built and tested in their own workspace.
exclude = ["src/scensim_world_protocol", "src/scensim_carla_world"]

# colcon-cargo-ros2 (0.5.5) writes this workspace's message patches into this file, between its
# markers, as links under .cargo/ros2-bindings (git-ignored, made by each build), not into
# .cargo/config.toml, which cargo would merge into the nested workspaces above (issue 187)
[workspace.metadata.ros2]
patches-in-manifest = true

[profile.dev-release]
inherits = "release"
debug = true
debug-assertions = true

# BEGIN colcon-cargo-ros2 generated patches
[patch.crates-io]
# Generated by colcon build ([workspace.metadata.ros2] patches-in-manifest).
# The paths are links under .cargo/ros2-bindings/ that each build points at
# the generated crates. Do not edit between the markers; commit changes.
action_msgs = { path = ".cargo/ros2-bindings/action_msgs" }
builtin_interfaces = { path = ".cargo/ros2-bindings/builtin_interfaces" }
example_interfaces = { path = ".cargo/ros2-bindings/example_interfaces" }
rcl_interfaces = { path = ".cargo/ros2-bindings/rcl_interfaces" }
rmw_dds_common = { path = ".cargo/ros2-bindings/rmw_dds_common" }
scensim_interfaces = { path = ".cargo/ros2-bindings/scensim_interfaces" }
test_msgs = { path = ".cargo/ros2-bindings/test_msgs" }
unique_identifier_msgs = { path = ".cargo/ros2-bindings/unique_identifier_msgs" }
# END colcon-cargo-ros2
